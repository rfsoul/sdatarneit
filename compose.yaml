services:
  sdatarneit:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8085:8085"
    environment:
      ENQUIRY_WEBHOOK_URL: ${ENQUIRY_WEBHOOK_URL:-}
      ENQUIRY_WEBHOOK_TOKEN: ${ENQUIRY_WEBHOOK_TOKEN:-}
      ALLOWED_ORIGINS: https://sdatarneit.au
      TRUST_PROXY: ${TRUST_PROXY:-false}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8085/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
