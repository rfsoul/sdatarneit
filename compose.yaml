services:
  sdatarneit:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8085:8085"
    environment:
      ENQUIRIES_DIR: /data/enquiries
      ALLOWED_ORIGINS: https://sdatarneit.au
      TRUST_PROXY: ${TRUST_PROXY:-false}
    volumes:
      - enquiries:/data/enquiries
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8085/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  enquiries:
